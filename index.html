<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Valentine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container1">
        <h1>Heyyy!!!I made something for you💖</h1>
        <h2>Do you wanna see??🥹💗</h2>
    </div>
    <div class="container2">
        <img src="download.gif" alt="kiss">
    </div>
    <div class="container3">
        <a href="yes.html">
        <button class="yes" id="btn">YES</button>
    </a>
    <a href="no.html">
        <button class="no">NO</button>
    </a>
    </div>
    <audio autoplay loop>
    <source src="Ruth B. - Dandelions (Lyrics).mp3" type="audio/mpeg">
</audio>
<script>
        function playMusic() {
            document.getElementById("bgMusic").play();
            window.location.href = "index.html";
        }
    </script>

    <script>
document.addEventListener("click", function (e) {
  for (let i = 0; i < 6; i++) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💗";

    heart.style.left = e.clientX + (Math.random() * 40 - 20) + "px";
    heart.style.top = e.clientY + (Math.random() * 40 - 20) + "px";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 1500);
  }
});
</script>
</body>
</html>
